name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build
        run: |
          docker build -t emote-builder .
          docker run --rm -v "${PWD}:/project" emote-builder make
      - uses: actions/upload-artifact@v4
        with:
          name: emote_only
          path: emote_only.wps
